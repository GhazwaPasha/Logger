services:
  - type: web
    name: logger-api
    runtime: node
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Ask LogBase (apps/api/src/agent). Set the value in the Render dashboard; never commit it.
      - key: GEMINI_API_KEY
        sync: false
