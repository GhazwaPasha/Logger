<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task board and panel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="base.css">
<style>
.bd{display:flex;border-top:0.5px solid var(--border);border-bottom:0.5px solid var(--border);overflow:hidden;position:relative;min-height:470px}
.cols{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:14px 0;min-width:0}
.ch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);margin:0 0 8px 2px}
.tc{border:0.5px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--surface-2);transition:transform 120ms ease-out,border-color 150ms}
.tc:hover{border-color:var(--border-strong)}
.tc:active{transform:scale(0.98)}
.tc.sel{border-color:var(--text-primary)}
.meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--text-secondary)}
.av{width:20px;height:20px;border-radius:50%;border:0.5px solid var(--border-strong);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-secondary);flex-shrink:0}
.pr{display:inline-flex;gap:1.5px;align-items:flex-end;height:10px}
.pr i{width:2.5px;border-radius:1px;background:var(--border-strong);font-style:normal}
.pr i.on{background:var(--text-primary)}
.prog{height:2px;border-radius:1px;background:var(--border);margin-top:9px;position:relative;overflow:hidden}
.prog b{position:absolute;inset:0 auto 0 0;background:var(--text-primary);border-radius:1px}
.pn{width:0;flex-shrink:0;overflow:hidden;border-left:0.5px solid transparent}
.pin{width:340px;padding:14px 0 14px 20px}
.prow{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;min-height:34px;font-size:13px}
.prow>span:first-child{color:var(--text-secondary)}
.pv{display:inline-flex;align-items:center;gap:7px;padding:3px 6px;margin-left:-6px;border-radius:7px;cursor:pointer;width:fit-content}
.pv:hover{background:var(--surface-1)}
.ck{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;cursor:pointer}
.box{width:16px;height:16px;border-radius:5px;border:1px solid var(--border-stronger);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 150ms,border-color 150ms}
.box svg path{stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset 220ms cubic-bezier(.22,1,.36,1)}
.ck.done .box{background:var(--text-primary);border-color:var(--text-primary)}
.ck.done .box svg path{stroke-dashoffset:0}
.ck.done .lbl{color:var(--text-muted);text-decoration:line-through}
.seg{position:relative;display:inline-flex;padding:2px;border-radius:9px;background:var(--surface-1)}
.seg span{position:relative;z-index:1;font-size:12px;padding:3px 11px;cursor:pointer;color:var(--text-secondary);transition:color 150ms}
.seg span.on{color:var(--text-primary)}
.segp{position:absolute;top:2px;bottom:2px;left:0;border-radius:7px;background:var(--surface-2);border:0.5px solid var(--border)}
.sd{width:8px;height:8px;border-radius:50%;display:inline-block}
.pin button{border:none;padding:4px 6px}
</style></head>
<body><main>
<p class="page-note">Tasks · board cards and docked task panel · design mockup (Nov 2026). Not built yet; revisit before building. Single assignee per task.</p>
<div class="bd"><div class="cols" id="cols"></div><div class="pn" id="pn"><div class="pin" id="pin"></div></div></div>
</main>
<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;const live=new Map();
function spring(k,to,apply,r=0.35,from){const p=live.get(k);if(p)cancelAnimationFrame(p.raf);let f=from!==undefined?from:(p?p.cur:to);if(RM){live.set(k,{cur:to});apply(to);return;}
const w=2*Math.PI/r,t0=performance.now(),st={cur:f};live.set(k,st);const step=n=>{const t=(n-t0)/1000,v=to+(f-to)*(1+w*t)*Math.exp(-w*t);st.cur=v;apply(v);if(Math.abs(v-to)>0.002*Math.max(1,Math.abs(to)))st.raf=requestAnimationFrame(step);else{st.cur=to;apply(to);}};st.raf=requestAnimationFrame(step);}
const ST={pending:['To do','var(--text-muted)'],in_progress:['In progress','var(--text-warning)'],done:['Done','var(--text-success)']};
const tasks=[
 {id:1,s:'pending',t:'Send November invoices to retail clients',a:'AK',an:'Ali Khan',p:3,due:'Today, 5:00 pm',dueTone:'danger',subs:[['Pull order list',1],['Draft invoices',0],['Send by email',0]],rep:false,list:'Sales · Billing'},
 {id:2,s:'pending',t:'Update product photos',a:'ZB',an:'Zara Baig',p:1,due:'Fri 20 Nov',subs:[],rep:false,list:'Marketing · Store'},
 {id:3,s:'in_progress',t:'Weekly stock count',a:'HM',an:'Hamza Malik',p:2,due:'Every Mon',subs:[['Warehouse A',1],['Warehouse B',1],['Reconcile sheet',0]],rep:true,list:'Ops · Inventory'},
 {id:4,s:'in_progress',t:'Call back leads from the expo',a:'SR',an:'Sara Riaz',p:3,due:'Tomorrow',subs:[],rep:false,list:'Sales · Leads'},
 {id:5,s:'done',t:'Renew domain and hosting',a:'AK',an:'Ali Khan',p:1,due:'Done 14 Nov',subs:[],rep:false,list:'Ops · IT'}
];
let sel=null;
const prBars=p=>`<span class="pr" title="${['','Low','Medium','High'][p]} priority">${[1,2,3].map(i=>`<i class="${i<=p?'on':''}" style="height:${3+i*2.3}px"></i>`).join('')}</span>`;
function card(t){const d=t.subs.filter(s=>s[1]).length,n=t.subs.length;
 return `<div class="tc ${sel===t.id?'sel':''}" data-id="${t.id}">
  <div style="font-size:13px;line-height:1.4;${t.s==='done'?'color:var(--text-secondary)':''}">${t.t}</div>
  ${n?`<div class="prog"><b id="pg${t.id}" style="width:${d/n*100}%"></b></div>`:''}
  <div class="meta"><span class="av" title="${t.an}">${t.a}</span>${prBars(t.p)}
   <span style="margin-left:auto;display:inline-flex;align-items:center;gap:4px;${t.dueTone?'color:var(--text-danger)':''}">${t.rep?'<i class="ti ti-repeat" aria-hidden="true"></i>':''}${t.due}</span>
   ${n?`<span style="font-variant-numeric:tabular-nums"><i class="ti ti-checkbox" aria-hidden="true"></i> ${d}/${n}</span>`:''}</div></div>`;}
function renderCols(){document.getElementById('cols').innerHTML=Object.keys(ST).map(k=>{const L=tasks.filter(t=>t.s===k);return `<div><p class="ch"><span class="sd" style="background:${ST[k][1]}"></span>${ST[k][0]} <span style="color:var(--text-muted)">${L.length}</span></p>${L.map(card).join('')}</div>`}).join('');}
document.getElementById('cols').addEventListener('click',e=>{const c=e.target.closest('.tc');if(!c)return;const id=+c.dataset.id;open(id===sel?null:id);});
const pn=document.getElementById('pn');
function open(id){sel=id;renderCols();
 if(id){renderPanel();spring('pn',340,v=>{pn.style.width=v+'px';pn.style.borderLeftColor=v>2?'var(--border)':'transparent'},0.38);}
 else spring('pn',0,v=>{pn.style.width=v+'px';pn.style.borderLeftColor=v>2?'var(--border)':'transparent'},0.32);}
function renderPanel(){const t=tasks.find(x=>x.id===sel);const d=t.subs.filter(s=>s[1]).length;
 document.getElementById('pin').innerHTML=`
  <div style="display:flex;align-items:center;gap:4px;margin-bottom:10px">
   <span style="font-size:12px;color:var(--text-muted)">${t.list}</span>
   <span style="margin-left:auto;display:flex;gap:2px">
    <button aria-label="Ask about this task"><i class="ti ti-sparkles" aria-hidden="true"></i></button>
    <button aria-label="More"><i class="ti ti-dots" aria-hidden="true"></i></button>
    <button aria-label="Close" id="cls"><i class="ti ti-x" aria-hidden="true"></i></button></span></div>
  <div contenteditable="true" style="font-size:18px;font-weight:500;letter-spacing:-0.015em;line-height:1.3;outline:none">${t.t}</div>
  <div style="margin-top:12px">
   <div class="prow"><span>Status</span><span class="pv"><span class="sd" style="background:${ST[t.s][1]}"></span>${ST[t.s][0]}<i class="ti ti-chevron-down" style="color:var(--text-muted);font-size:12px" aria-hidden="true"></i></span></div>
   <div class="prow"><span>Assignee</span><span class="pv"><span class="av">${t.a}</span>${t.an}</span></div>
   <div class="prow"><span>Priority</span><span class="pv">${prBars(t.p)}${['','Low','Medium','High'][t.p]}</span></div>
   <div class="prow"><span>Due</span><span class="pv" style="${t.dueTone?'color:var(--text-danger)':''}">${t.rep?'<i class="ti ti-repeat" aria-hidden="true"></i>':'<i class="ti ti-calendar" aria-hidden="true"></i>'}${t.due}</span></div>
  </div>
  <div style="border-top:0.5px solid var(--border);margin-top:10px;padding-top:12px">
   <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-size:13px;font-weight:500">Checklist</span><span style="font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums" id="cnt">${t.subs.length?d+' of '+t.subs.length:''}</span></div>
   <div id="subs">${t.subs.map((s,i)=>`<div class="ck ${s[1]?'done':''}" data-i="${i}"><span class="box"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.8 5.2l2.1 2.1L8.2 2.8" fill="none" stroke="var(--surface-2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="lbl">${s[0]}</span></div>`).join('')}
   <div class="ck" style="color:var(--text-muted)"><i class="ti ti-plus" style="width:16px;text-align:center" aria-hidden="true"></i>Add item</div></div>
  </div>
  <div style="border-top:0.5px solid var(--border);margin-top:8px;padding-top:12px;display:flex;gap:14px;font-size:12px;color:var(--text-secondary)">
   <span><i class="ti ti-paperclip" aria-hidden="true"></i> Attach</span><span><i class="ti ti-clock" aria-hidden="true"></i> Track time</span><span><i class="ti ti-link" aria-hidden="true"></i> Depends on</span></div>
  <div style="border-top:0.5px solid var(--border);margin-top:12px;padding-top:12px">
   <div class="seg" id="tabs"><div class="segp"></div><span class="on">Comments</span><span>Activity</span></div>
   <div id="feed" style="margin-top:10px;font-size:13px"></div>
   <div style="margin-top:10px;border:0.5px solid var(--border);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text-muted)">Write a comment…</div>
  </div>`;
 document.getElementById('cls').onclick=()=>open(null);
 document.getElementById('subs').addEventListener('click',e=>{const r=e.target.closest('.ck[data-i]');if(!r)return;const i=+r.dataset.i;t.subs[i][1]=t.subs[i][1]?0:1;r.classList.toggle('done');
  const dd=t.subs.filter(s=>s[1]).length;document.getElementById('cnt').textContent=dd+' of '+t.subs.length;const pg=document.getElementById('pg'+t.id);
  if(pg)spring('pg'+t.id,dd/t.subs.length*100,v=>pg.style.width=v+'%',0.4,parseFloat(pg.style.width));});
 const tabs=document.getElementById('tabs'),sp=tabs.querySelector('.segp'),ts=[...tabs.querySelectorAll('span')];
 const feeds=[`<div style="display:flex;gap:8px"><span class="av">SR</span><div><span style="font-weight:500">Sara</span> <span style="color:var(--text-muted);font-size:12px">2h</span><p style="margin:2px 0 0">Two clients asked for a PDF copy as well.</p></div></div>`,
  `<div style="color:var(--text-secondary);line-height:1.9"><div>Ali checked “Pull order list” · 3h</div><div>Due moved to today · yesterday</div><div>Created by Hamza · Mon</div></div>`];
 const go=i=>{ts.forEach((x,j)=>x.classList.toggle('on',j===i));sp.style.width=ts[i].offsetWidth+'px';spring('tab',ts[i].offsetLeft,v=>sp.style.transform=`translateX(${v}px)`,0.3);const f=document.getElementById('feed');f.style.transition='none';f.style.opacity=0;f.innerHTML=feeds[i];requestAnimationFrame(()=>{f.style.transition='opacity 180ms';f.style.opacity=1;});};
 ts.forEach((x,i)=>x.addEventListener('pointerdown',()=>go(i)));requestAnimationFrame(()=>go(0));}
renderCols();setTimeout(()=>open(1),350);
</script>
</body></html>
