<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trackers web</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="base.css">
<style>
.tw{display:grid;grid-template-columns:220px minmax(0,1fr);border-top:0.5px solid var(--border);border-bottom:0.5px solid var(--border)}
.side{position:relative;border-right:0.5px solid var(--border);padding:14px 10px 14px 0}
.hl{position:absolute;left:0;right:10px;top:0;border-radius:10px;background:var(--surface-1);will-change:transform,height}
.row{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;user-select:none;transition:transform 100ms ease-out}
.row:active{transform:scale(0.98)}
.av{width:26px;height:26px;border-radius:50%;border:0.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-secondary);flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cap{font-size:12px;color:var(--text-secondary);margin:0}
.seg{position:relative;display:inline-flex;padding:2px;border-radius:9px;background:var(--surface-1)}
.seg span{position:relative;z-index:1;font-size:12px;padding:3px 10px;cursor:pointer;color:var(--text-secondary);transition:color 150ms}
.seg span.on{color:var(--text-primary)}
.segp{position:absolute;top:2px;bottom:2px;left:0;border-radius:7px;background:var(--surface-2);border:0.5px solid var(--border)}
.track{height:3px;border-radius:2px;background:var(--border);position:relative;margin-top:10px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--text-primary);width:0}
.tick{position:absolute;top:-4px;width:1.5px;height:11px;border-radius:1px}
.num{font-size:28px;font-weight:500;letter-spacing:-0.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.sq{width:12px;height:12px;border-radius:3px;transform:scale(0);transition:transform 300ms cubic-bezier(.34,1.3,.64,1)}
.btn-p{background:var(--text-primary);color:var(--surface-2);border:none}
@media (max-width:700px){.tw{grid-template-columns:1fr}.side{border-right:none;border-bottom:0.5px solid var(--border)}#metrics{grid-template-columns:1fr!important}#metrics>div{border-left:none!important;padding:0 0 12px!important}}
</style></head>
<body><main>
<p class="page-note">Trackers · web list and detail · design mockup (Nov 2026). Flat layout, spring motion (Apple fluid-interface rules, Animate UI patterns).</p>
<div class="tw">
  <div class="side">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:0 10px 10px">
      <span style="font-size:15px;font-weight:500;letter-spacing:-0.01em">Trackers</span>
      <button aria-label="New tracker" style="padding:2px 7px"><i class="ti ti-plus" aria-hidden="true"></i></button>
    </div>
    <div class="hl" id="hl"></div>
    <div id="rows"></div>
  </div>
  <div style="padding:16px 0 18px 22px;min-width:0">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div><p id="t-name" style="margin:0;font-size:20px;font-weight:500;letter-spacing:-0.015em">Q4 Sales</p><p class="cap" id="t-meta" style="margin-top:2px"></p></div>
      <div style="display:flex;gap:6px"><button class="btn-p">Log entry</button><button aria-label="More" style="padding:4px 8px"><i class="ti ti-dots" aria-hidden="true"></i></button></div>
    </div>
    <div id="metrics" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px"></div>
    <div style="margin-top:22px;display:flex;justify-content:space-between;align-items:center">
      <span id="c-title" style="font-size:13px;font-weight:500"></span>
      <div class="seg" id="seg"><div class="segp" id="segp"></div><span class="on">Cumulative</span><span>Weekly</span><span>Daily</span></div>
    </div>
    <svg id="chart" viewBox="0 0 460 120" style="width:100%;height:120px;margin-top:8px;overflow:visible" role="img"><title>Progress against target</title></svg>
    <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:500">Check-ins</span><span class="cap" id="streak"></span></div>
    <div id="sqs" style="display:flex;gap:4px;margin:8px 0 6px"></div>
    <div id="entries" style="font-size:13px"></div>
  </div>
</div>
</main>
<script>
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const live = new Map();
function spring(key, to, apply, response=0.38){
  const prev = live.get(key); if(prev) cancelAnimationFrame(prev.raf);
  let from = prev ? prev.cur : 0;
  if(RM){ live.set(key,{cur:to}); apply(to); return; }
  const w = 2*Math.PI/response, t0 = performance.now(), st = {cur:from};
  live.set(key, st);
  const step = (now)=>{ const t=(now-t0)/1000; const v = to + (from-to)*(1+w*t)*Math.exp(-w*t);
    st.cur=v; apply(v); if(Math.abs(v-to)>0.001*Math.max(1,Math.abs(to))) st.raf=requestAnimationFrame(step); else {st.cur=to; apply(to);} };
  st.raf=requestAnimationFrame(step);
}
const fmt = (v,u)=> u==='k' ? (v>=1000? (v/1000).toFixed(v>=100000?0:1)+'k' : Math.round(v).toLocaleString()) : Math.round(v).toLocaleString();
const T = [
 {name:'Q4 Sales',who:'Ali Khan',ini:'AK',cad:'Daily',meta:'Ali Khan · 1 Oct – 31 Dec · day 47 of 78',exp:0.6,status:'Behind',tone:'danger',
  m:[{n:'Revenue',v:312000,t:600000,u:'k',note:'48k behind · need 9.3k a day'},{n:'Orders',v:38,t:60,note:'2 ahead of pace'},{n:'Avg order size',v:8210,t:10000,u:'k',calc:true,note:'Revenue ÷ Orders'}],
  series:[0,6,11,15,22,26,31,38,41,48,52],ci:[1,1,1,0,1,1,1,1,0,1,1,1,1,2],
  e:[['Today','Not logged',2],['Fri 13 Nov','2 orders · 18,400',1],['Thu 12 Nov','Missed',0]]},
 {name:'Lead gen Nov',who:'Sara Riaz',ini:'SR',cad:'Weekly',meta:'Sara Riaz · 1 – 30 Nov · week 3 of 5',exp:0.5,status:'On pace',tone:'success',
  m:[{n:'Leads',v:142,t:280,note:'On pace'},{n:'Qualified',v:51,t:90,note:'6 ahead of pace'},{n:'Qualify rate',v:36,t:35,calc:true,note:'Qualified ÷ Leads %'}],
  series:[0,8,17,26,34,43,50],ci:[1,1,2],e:[['Week of 16 Nov','Due Friday',2],['Week of 9 Nov','61 leads · 24 qualified',1],['Week of 2 Nov','81 leads · 27 qualified',1]]},
 {name:'New clients',who:'Hamza Malik',ini:'HM',cad:'Weekly',meta:'Hamza Malik · Q4 · week 7 of 13',exp:0.54,status:'Ahead',tone:'success',
  m:[{n:'Clients signed',v:14,t:20,note:'3 ahead of pace'},{n:'Contract value',v:910000,t:1500000,u:'k',note:'On pace'},{n:'Avg contract',v:65000,t:70000,u:'k',calc:true,note:'Value ÷ Clients'}],
  series:[0,7,15,24,33,44,56,70],ci:[1,1,1,1,1,1,2],e:[['Week of 16 Nov','Due Friday',2],['Week of 9 Nov','3 clients · 210k',1],['Week of 2 Nov','2 clients · 150k',1]]},
 {name:'Store orders',who:'Zara Baig',ini:'ZB',cad:'Daily',meta:'Zara Baig · November · day 11 of 21',exp:0.52,status:'Missed 2',tone:'warning',
  m:[{n:'Orders',v:204,t:420,note:'14 behind · need 21.6 a day'},{n:'Revenue',v:1630000,t:3200000,u:'k',note:'On pace'},{n:'Avg order size',v:7990,t:7600,u:'k',calc:true,note:'Revenue ÷ Orders'}],
  series:[0,5,10,14,14,19,24,29,29,34,49],ci:[1,1,1,0,1,1,1,0,1,1,2],e:[['Today','Not logged',2],['Fri 13 Nov','22 orders · 171k',1],['Thu 12 Nov','Missed',0]]}
];
const toneVar = t=>`var(--text-${t})`;
let sel = 0, mode = 0;
const rowsEl = document.getElementById('rows');
rowsEl.innerHTML = T.map((t,i)=>`<div class="row" data-i="${i}"><div class="av">${t.ini}</div><div style="flex:1;min-width:0"><p style="margin:0;font-size:13px;font-weight:500">${t.name}</p><p class="cap">${t.who.split(' ')[0]} · ${t.cad.toLowerCase()}</p></div><span class="dot" style="background:${toneVar(t.tone)}" title="${t.status}"></span></div>`).join('');
const hl = document.getElementById('hl');
function moveHl(){ const r = rowsEl.children[sel]; spring('hly', r.offsetTop, v=>hl.style.transform=`translateY(${v}px)`); hl.style.height=r.offsetHeight+'px'; }
rowsEl.addEventListener('pointerdown', e=>{ const r=e.target.closest('.row'); if(!r) return; sel=+r.dataset.i; moveHl(); render(); });
const seg = document.getElementById('seg'), segp = document.getElementById('segp'), segs=[...seg.querySelectorAll('span')];
function moveSeg(){ const s=segs[mode]; segs.forEach((x,i)=>x.classList.toggle('on',i===mode)); segp.style.width=s.offsetWidth+'px'; spring('seg', s.offsetLeft, v=>segp.style.transform=`translateX(${v}px)`, 0.3); }
segs.forEach((s,i)=>s.addEventListener('pointerdown',()=>{mode=i;moveSeg();drawChart();}));
function render(){
  const t = T[sel];
  document.getElementById('t-name').textContent=t.name;
  document.getElementById('t-meta').textContent=t.meta+' · '+t.cad.toLowerCase()+' check-in';
  const M = document.getElementById('metrics');
  M.innerHTML = t.m.map((m,i)=>{
    const ahead = m.v/m.t >= t.exp - 0.005; const nt = m.calc ? (m.v>=m.t?'success':'danger') : (ahead?'success':'danger');
    return `<div style="padding:0 18px;${i?'border-left:0.5px solid var(--border);':'padding-left:0;'}">
      <p class="cap">${m.n}${m.calc?' <span style="color:var(--text-muted)">· calculated</span>':''}</p>
      <p style="margin:4px 0 0"><span class="num" id="mv${i}">0</span> <span style="font-size:13px;color:var(--text-muted)">/ ${m.calc?'≥ ':''}${fmt(m.t,m.u)}</span></p>
      ${m.calc?'<div style="height:13px"></div>':`<div class="track"><div class="fill" id="mf${i}"></div><div class="tick" style="left:${t.exp*100}%;background:${toneVar(nt)}"></div></div>`}
      <p class="cap" style="margin-top:8px;color:${m.calc?'var(--text-secondary)':toneVar(nt)}">${m.note}</p></div>`;}).join('');
  t.m.forEach((m,i)=>{ const el=document.getElementById('mv'+i), f=document.getElementById('mf'+i);
    spring('mv'+i, m.v, v=>el.textContent=fmt(v,m.u), 0.6);
    if(f) spring('mf'+i, Math.min(1,m.v/m.t)*100, v=>f.style.width=v+'%', 0.5); });
  const sq = document.getElementById('sqs');
  sq.innerHTML = t.ci.map(c=>`<span class="sq" style="${c===1?'background:var(--text-primary)':c===0?'border:1px dashed var(--text-danger)':'border:0.5px solid var(--border-strong)'}"></span>`).join('');
  [...sq.children].forEach((s,i)=>setTimeout(()=>s.style.transform='scale(1)', RM?0:i*22));
  const missed = t.ci.filter(c=>c===0).length;
  document.getElementById('streak').textContent = missed? `${missed} missed this period` : 'No misses';
  document.getElementById('entries').innerHTML = t.e.map(([d,v,k])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:0.5px solid var(--border)"><span>${d}</span><span style="color:${k===0?'var(--text-danger)':k===2?'var(--text-muted)':'var(--text-primary)'}">${v}</span></div>`).join('');
  drawChart();
}
function drawChart(){
  const t=T[sel], m=t.m[0], svg=document.getElementById('chart'), W=460,H=110;
  document.getElementById('c-title').textContent = m.n+' vs target';
  const n=t.series.length, total = Math.round(1/t.exp*(n-1)), xs=i=>i/total*W;
  let body='<line x1="0" y1="'+H+'" x2="'+W+'" y2="'+H+'" stroke="var(--border)" stroke-width="0.5"/>';
  if(mode===0){
    const pts=t.series.map((v,i)=>`${xs(i).toFixed(1)},${(H-v/100*(H-10)).toFixed(1)}`).join(' ');
    const lx=xs(n-1), ly=H-t.series[n-1]/100*(H-10);
    body+=`<line x1="0" y1="${H}" x2="${W}" y2="10" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 4"/>
      <polyline id="pl" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>
      <circle cx="${lx}" cy="${ly}" r="3.5" fill="var(--text-primary)"/>
      <text x="${W}" y="6" text-anchor="end" style="font-size:11px;fill:var(--text-muted)">target ${fmt(m.t,m.u)}</text>`;
  } else {
    const k = mode===1? Math.max(4,Math.ceil(n/2)) : n-1, bw=W/total*(mode===1?1.6:0.6), slice=(H-10)/(mode===1?6:10);
    for(let i=0;i<k;i++){ const v=(t.series[Math.min(i+1,n-1)]-t.series[Math.min(i,n-1)]); const h=Math.max(2,(mode===1?v*1.2:v)*slice/(mode===1?8:6)); const x=(mode===1? i*W/(total/2):xs(i+1)-bw/2);
      body+=`<rect class="bar" x="${x.toFixed(1)}" y="${H}" width="${bw.toFixed(1)}" height="0" rx="2" fill="var(--text-primary)" data-h="${h.toFixed(1)}"/>`; }
    const sy = H-(mode===1? slice*4.2 : slice*5); body+=`<line x1="0" y1="${sy}" x2="${W}" y2="${sy}" stroke="var(--text-muted)" stroke-dasharray="3 4"/><text x="${W}" y="${sy-5}" text-anchor="end" style="font-size:11px;fill:var(--text-muted)">${mode===1?'weekly':'daily'} slice</text>`;
  }
  svg.innerHTML=body;
  const pl=svg.querySelector('#pl');
  if(pl && !RM){ const L=pl.getTotalLength(); pl.style.strokeDasharray=L; pl.style.strokeDashoffset=L; pl.getBoundingClientRect(); pl.style.transition='stroke-dashoffset 700ms cubic-bezier(.22,1,.36,1)'; pl.style.strokeDashoffset=0; }
  svg.querySelectorAll('.bar').forEach((b,i)=>{ const h=+b.dataset.h; spring('bar'+Math.random(), h, v=>{b.setAttribute('height',v);b.setAttribute('y',H-v);}, 0.45+i*0.02); });
}
requestAnimationFrame(()=>{ moveHl(); moveSeg(); render(); });
</script>
</body></html>
